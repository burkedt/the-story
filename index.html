<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="preload" as="image" href="images/the-story-001.jpg">
<title>The Story</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0a0a0a;
    color: #fff;
    overflow: hidden;
    height: 100vh;
    height: 100dvh;
  }
  #story {
    display: flex;
    height: 100%;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
  }
  #story::-webkit-scrollbar { display: none; }
  .slide {
    flex: 0 0 100%;
    height: 100%;
    scroll-snap-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px 80px;
    position: relative;
  }
  .frame {
    background: #111;
    padding: 10px;
    border-radius: 2px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.6);
    max-width: 92vw;
    max-height: 75vh;
  }
  .mat {
    background: #f8f8f8;
    padding: 18px;
  }
  .mat img {
    display: block;
    width: 100%;
    height: auto;
    max-height: 62vh;
    object-fit: contain;
    filter: contrast(1.05);
  }
  .progress {
    position: fixed;
    bottom: 28px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    gap: 8px;
    z-index: 10;
    pointer-events: none;
  }
  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: rgba(255,255,255,0.35);
    transition: all 0.3s;
  }
  .dot.active {
    background: #fff;
    transform: scale(1.3);
  }
  .nav-btn {
    position: fixed;
    bottom: 22px;
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    padding: 10px 18px;
    border-radius: 24px;
    font-size: 14px;
    cursor: pointer;
    z-index: 20;
    transition: background 0.2s;
  }
  .nav-btn:hover { background: rgba(255,255,255,0.2); }
  #gallery-btn { right: 16px; }
  #back-btn { left: 16px; display: none; }

  /* Gallery view */
  #gallery {
    display: none;
    position: fixed;
    inset: 0;
    background: #0a0a0a;
    overflow-y: auto;
    padding: 70px 16px 40px;
    z-index: 5;
  }
  #gallery h1 {
    text-align: center;
    font-weight: 300;
    letter-spacing: 4px;
    font-size: 18px;
    margin-bottom: 24px;
    text-transform: uppercase;
    opacity: 0.8;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    max-width: 600px;
    margin: 0 auto;
  }
  .grid .frame {
    max-width: none;
    max-height: none;
    cursor: pointer;
    transition: transform 0.2s;
  }
  .grid .frame:active { transform: scale(0.98); }
  .grid .mat { padding: 12px; }
  .grid .mat img { max-height: none; }

  /* Lightbox */
  #lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.95);
    z-index: 100;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    padding: 20px;
  }
  #lightbox img {
    max-width: 100%;
    max-height: 75vh;
    object-fit: contain;
    border: 8px solid #111;
    outline: 16px solid #f8f8f8;
  }
  .lightbox-actions {
    margin-top: 20px;
    display: flex;
    gap: 12px;
  }
  .lightbox-actions button, .lightbox-actions a {
    background: #fff;
    color: #000;
    border: none;
    padding: 12px 24px;
    border-radius: 24px;
    font-size: 15px;
    font-weight: 500;
    text-decoration: none;
    cursor: pointer;
  }
  .close-lb {
    position: absolute;
    top: 16px;
    right: 16px;
    background: rgba(255,255,255,0.15);
    border: none;
    color: #fff;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    font-size: 22px;
    cursor: pointer;
  }
  @media (min-width: 700px) {
    .grid { grid-template-columns: 1fr 1fr 1fr; gap: 20px; }
    .slide { padding: 60px; }
  }
</style>
</head>
<body>
<div id="story">
  <!-- slides injected by JS -->
</div>
<div class="progress" id="progress"></div>
<button class="nav-btn" id="gallery-btn">Gallery</button>
<button class="nav-btn" id="back-btn">Story</button>

<div id="gallery">
  <h1>The Story</h1>
  <div class="grid" id="grid"></div>
</div>

<div id="lightbox">
  <button class="close-lb" id="close-lb">×</button>
  <img id="lb-img" alt="">
  <div class="lightbox-actions">
    <a id="save-btn" download>Save to Phone</a>
    <button id="close-btn">Close</button>
  </div>
</div>

<script>
const images = Array.from({length: 10}, (_, i) => `images/the-story-${String(i+1).padStart(3,'0')}.jpg`);

const story = document.getElementById('story');
const progress = document.getElementById('progress');
const gallery = document.getElementById('gallery');
const grid = document.getElementById('grid');
const galleryBtn = document.getElementById('gallery-btn');
const backBtn = document.getElementById('back-btn');
const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lb-img');
const saveBtn = document.getElementById('save-btn');

// Build story slides
images.forEach((src, i) => {
  const slide = document.createElement('div');
  slide.className = 'slide';
  slide.innerHTML = `
    <div class="frame">
      <div class="mat">
        <img src="${src}" alt="Photo ${i+1}" loading="${i === 0 ? 'eager' : 'lazy'}" decoding="async">
      </div>
    </div>`;
  story.appendChild(slide);

  const dot = document.createElement('div');
  dot.className = 'dot';
  if (i === 0) dot.classList.add('active');
  progress.appendChild(dot);
});

// Build gallery grid (using small thumbs)
images.forEach((src, i) => {
  const thumb = src.replace('images/', 'images/thumbs/');
  const frame = document.createElement('div');
  frame.className = 'frame';
  frame.innerHTML = `<div class="mat"><img src="${thumb}" alt="Photo ${i+1}" loading="lazy" decoding="async"></div>`;
  frame.addEventListener('click', () => openLightbox(src, i+1));
  grid.appendChild(frame);
});

// Progress tracking
story.addEventListener('scroll', () => {
  const index = Math.round(story.scrollLeft / story.offsetWidth);
  document.querySelectorAll('.dot').forEach((d, i) => {
    d.classList.toggle('active', i === index);
  });
});

// Gallery toggle
galleryBtn.addEventListener('click', () => {
  gallery.style.display = 'block';
  galleryBtn.style.display = 'none';
  backBtn.style.display = 'block';
  progress.style.display = 'none';
});
backBtn.addEventListener('click', () => {
  gallery.style.display = 'none';
  galleryBtn.style.display = 'block';
  backBtn.style.display = 'none';
  progress.style.display = 'flex';
});

// Lightbox
function openLightbox(src, num) {
  lbImg.src = src;
  saveBtn.href = src;
  saveBtn.download = `the-story-${String(num).padStart(2,'0')}.jpg`;
  saveBtn.onclick = async (e) => {
    e.preventDefault();
    try {
      const response = await fetch(src);
      const blob = await response.blob();
      const file = new File([blob], saveBtn.download, { type: 'image/jpeg' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: 'The Story' });
      } else {
        // Fallback download
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = saveBtn.download;
        a.click();
        URL.revokeObjectURL(a.href);
      }
    } catch (err) {
      // User cancelled or share failed — fall back to direct link
      window.open(src, '_blank');
    }
  };
  lightbox.style.display = 'flex';
}
document.getElementById('close-lb').addEventListener('click', () => lightbox.style.display = 'none');
document.getElementById('close-btn').addEventListener('click', () => lightbox.style.display = 'none');
lightbox.addEventListener('click', (e) => {
  if (e.target === lightbox) lightbox.style.display = 'none';
});

// Also allow click on story images to open lightbox/save
document.querySelectorAll('#story .frame').forEach((frame, i) => {
  frame.style.cursor = 'pointer';
  frame.addEventListener('click', () => openLightbox(images[i], i+1));
});
</script>
</body>
</html>
